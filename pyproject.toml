[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archmemory"
version = "0.1.0"
description = "Persistent software memory layer for AI coding agents, exposed over MCP."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
archmemory = "archmemory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["archmemory*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
