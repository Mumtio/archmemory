*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;overflow:hidden}
#stage{flex:1;position:relative}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
aside{
  width:340px;flex:none;background:var(--panel);border-left:1px solid var(--rule);
  padding:20px;overflow-y:auto;
}
h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
.sub{font-size:11.5px;color:var(--ink3);font-family:var(--mono);margin:0 0 18px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);
   font-family:var(--mono);margin:22px 0 8px;font-weight:500}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;
      border-bottom:1px solid var(--rule)}
.stat b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.empty{font-size:13px;color:var(--ink3);line-height:1.5}
.card{font-size:13px;line-height:1.5}
.card .name{font-family:var(--mono);font-size:14px;font-weight:600;margin-bottom:2px}
.card .path{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-bottom:10px}
.card p{margin:0 0 10px;color:var(--ink2)}
.flag{border-left:3px solid var(--bad);background:var(--badbg);padding:9px 11px;margin:10px 0;
      font-size:12.5px;line-height:1.45}
.flag .t{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
         color:var(--bad);display:block;margin-bottom:4px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink2)}
.legend div{display:flex;align-items:center;gap:9px}
.sw{width:22px;height:0;border-top:2px solid var(--edge);flex:none}
.sw.bad{border-top:2px dashed var(--bad)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--node);flex:none}
.dot.p{background:var(--bad)}
button{font-family:var(--sans);font-size:12.5px;padding:7px 12px;border:1px solid var(--rule);
       background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer;width:100%}
button:hover{border-color:var(--node)}
button.on{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.node circle{cursor:pointer;transition:r .15s}
.node text{font-size:10.5px;font-family:var(--mono);fill:var(--ink2);pointer-events:none;
           text-anchor:middle}
.node.sel circle{stroke:var(--ink);stroke-width:2.5}
.node.prot circle{fill:var(--bad)}
line.f{stroke:var(--bad);stroke-width:2;stroke-dasharray:5 4;opacity:0}
line.f.show{opacity:1}

    let dx=l.t.x-l.s.x, dy=l.t.y-l.s.y, d=Math.hypot(dx,dy)||1;
    const f=(d-125)*.012, ux=dx/d, uy=dy/d;
    l.s.vx+=ux*f; l.s.vy+=uy*f; l.t.vx-=ux*f; l.t.vy-=uy*f;
  }
  for(const n of nodes){
    n.vx += (W/2-n.x)*.0022; n.vy += (H/2-n.y)*.0022;
    n.x+=n.vx; n.y+=n.vy;
    const pad=r(n)+22;
    n.x=Math.max(pad,Math.min(W-pad,n.x)); n.y=Math.max(pad,Math.min(H-pad-10,n.y));
  }
  links.forEach((l,i)=>{const e=lineEls[i];
    e.setAttribute('x1',l.s.x);e.setAttribute('y1',l.s.y);
    e.setAttribute('x2',l.t.x);e.setAttribute('y2',l.t.y);});
  forbid.forEach((l,i)=>{const e=forbidEls[i];
    e.setAttribute('x1',l.s.x);e.setAttribute('y1',l.s.y);
    e.setAttribute('x2',l.t.x);e.setAttribute('y2',l.t.y);});
  nodes.forEach((n,i)=>nodeEls[i].setAttribute('transform',`translate(${n.x},${n.y})`));
  requestAnimationFrame(step);
}
step();

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function select(n){
  nodeEls.forEach(e=>e.classList.remove('sel'));
  nodeEls[nodes.indexOf(n)].classList.add('sel');
  const dependsOn = links.filter(l=>l.s===n).map(l=>l.t.label);
  const usedBy    = links.filter(l=>l.t===n).map(l=>l.s.label);
  let h = `<div class="card"><div class="name">${esc(n.label)}</div>`;
  h += `<div class="path">${esc(n.path)}</div>`;
  if(n.doc) h += `<p>${esc(n.doc)}</p>`;
  h += `<div class="stat"><span>functions</span><b>${n.functions}</b></div>`;
  h += `<div class="stat"><span>classes</span><b>${n.classes}</b></div>`;
  h += `<div class="stat"><span>depends on</span><b>${dependsOn.length}</b></div>`;
  h += `<div class="stat"><span>used by</span><b>${usedBy.length}</b></div>`;
  if(n.protected) h += `<div class="flag"><span class="t">Protected · ${esc(n.protected.id)}</span>
      ${esc(n.protected.decision)}<br><br>${esc(n.protected.reason||'')}</div>`;
  if(n.constraint) h += `<div class="flag"><span class="t">Rule · ${esc(n.constraint.id)}</span>
      Must not import <b>${esc(n.constraint.forbids)}</b><br><br>${esc(n.constraint.rationale||'')}</div>`;
  if(usedBy.length) h += `<h2>Used by</h2><div class="card">${usedBy.map(esc).join(', ')}</div>`;
  h += `</div>`;
  document.getElementById('detail').innerHTML = h;
}

const st = DATA.stats;
document.getElementById('stats').innerHTML = Object.entries(st)
  .map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('');

let on=false;
document.getElementById('toggle').addEventListener('click',e=>{
  on=!on;
  forbidEls.forEach(el=>el.classList.toggle('show',on));
  e.target.textContent = on ? 'Hide forbidden edges' : 'Show forbidden edges';
  e.target.classList.toggle('on',on);
});

addEventListener('resize',()=>{W=svg.clientWidth;H=svg.clientHeight;});
</script>
